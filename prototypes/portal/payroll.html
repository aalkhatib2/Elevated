<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll — Elevated Portal</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <a class="rail-brand" href="overview.html">
      <img src="../../brand/wordmark-elevated-light.svg" alt="Elevated" width="5424" height="799">
      <span class="rail-sub">Agent Portal</span>
    </a>
    <div class="rail-id">
      <div class="rail-who"><span class="dot"></span><span data-field="fullName">&nbsp;</span></div>
      <span class="rail-badge">Rep</span>
      <dl class="rail-kv">
        <dt>Team</dt><dd data-field="team">&mdash;</dd>
        <dt>Division</dt><dd data-field="division">&mdash;</dd>
        <dt>Market</dt><dd data-field="market">&mdash;</dd>
        <dt>Rep code</dt><dd data-field="repCode">&mdash;</dd>
      </dl>
    </div>
    <button class="rail-search" type="button">Quick search<span class="kbd">Ctrl K</span></button>
    <nav class="rail-nav">
      <a href="overview.html"><span class="sq"></span>Overview</a>
      <a href="orders.html"><span class="sq"></span>Orders</a>
      <a href="commission.html"><span class="sq"></span>Commission</a>
      <a href="payroll.html" aria-current="page"><span class="sq"></span>Payroll</a>
      <a href="team.html"><span class="sq"></span>My Team</a>
    </nav>
    <div class="rail-foot">
      <a href="account.html">Account</a>
      <a href="login.html" data-signout>Sign out</a>
    </div>
  </aside>

  <div class="main">

    <div class="topbar">
      <div>
        <h1>Payroll</h1>
        <div class="sub" data-pay-range>Weekly statement &middot; paid on install date</div>
      </div>
      <div class="topbar-right">
        <div class="seg" data-pay-nav>
          <button type="button" data-pay-prev aria-label="Previous week">&larr; Prev</button>
          <button type="button" data-pay-this aria-pressed="false">This week</button>
          <button type="button" data-pay-next aria-label="Next week">Next &rarr;</button>
        </div>
        <button class="chip" type="button" data-pay-print>Print / Save PDF</button>
        <button class="chip" type="button" data-pay-csv data-owner-only hidden>Export CSV</button>
        <button class="chip" type="button" data-pay-close data-owner-only hidden>Close week</button>
      </div>
    </div>

    <div class="pad">

      <div class="kpis" data-pay-kpis style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div>

      <div data-pay-msg class="tbl-msg" role="status" style="margin-top:16px"></div>

      <div data-pay-reps style="margin-top:20px"></div>

      <section data-pay-pending-wrap hidden style="margin-top:28px">
        <div class="sec-label">Pending &mdash; sold, not installed yet. Not paid; rolls forward.</div>
        <div class="tbl-wrap" style="margin-top:12px">
          <div class="tbl-scroll">
            <table class="tbl" style="min-width:560px">
              <thead><tr><th>Rep</th><th>Order #</th><th>Client</th><th>Gigs</th><th>Sold</th></tr></thead>
              <tbody data-pay-pending></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </div>
</div>

<style>
  [hidden] { display: none !important; }
  .pay-rep { margin-top: 20px; }
  .pay-rep h3 { font: 600 15px var(--font-display, inherit); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
  .pay-total td { font-weight: 700; border-top: 1px solid currentColor; }
  .pay-neg { color: #e5484d; }
  @media print {
    .rail, .fabs, .topbar-right, .ptabs { display: none !important; }
    .app { display: block; }
    body { background: #fff; color: #000; }
  }
</style>

<div class="fabs">
  <button class="fab" type="button" title="Reminders and what is new" aria-label="3 reminders">3<span class="badge"></span></button>
  <button class="fab primary" type="button" title="Ask Ridge, your assistant" aria-label="Ask Ridge, your assistant"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 2 16 9 9 16 2 9Z"/></svg></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script src="portal-auth.js"></script>
<script src="portal.js"></script>
<script src="payroll.js"></script>

</body>
</html>
