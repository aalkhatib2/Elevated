<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In — Elevated Portal</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0B0D;
    --bg-2: #111317;
    --bg-3: #17191E;
    --line: rgba(240,237,230,0.10);
    --line-2: rgba(240,237,230,0.18);
    --text: #F0EDE6;
    --text-2: #B9B6AE;
    --muted: #8E8B84;
    --accent: #D9622B;
    --accent-ink: #0A0B0D;
    --head: "Oswald", "Arial Narrow", Impact, sans-serif;
    --body: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --label: "Manrope", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad: clamp(20px, 5vw, 48px);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--body); font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: clip;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  h1 { margin: 0; font-family: var(--head); font-weight: 600; text-transform: uppercase; line-height: 0.95; letter-spacing: 0.005em; }
  p { margin: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .kicker {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--label); font-weight: 600; font-size: 13px;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-2);
  }
  .kicker::before { content: ""; width: 28px; height: 2px; background: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 0 30px;
    font-family: var(--label); font-weight: 600; font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
    border: 1px solid transparent; border-radius: 0; cursor: pointer; white-space: nowrap;
    transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease);
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: var(--text); }
  .btn:disabled { cursor: progress; background: var(--text); }
  .arrow { width: 16px; height: 16px; transition: transform .3s var(--ease); }
  .btn:hover .arrow { transform: translateX(4px); }
  .spinner { display: none; width: 12px; height: 12px; border: 1.5px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
  .btn[aria-busy="true"] .spinner { display: block; }
  .btn[aria-busy="true"] .arrow { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* layout: one column on small screens, the drawn aside joins at 1024px */
  .login { position: relative; min-height: 100svh; overflow: hidden; }
  @media (min-width: 1024px) { .login { display: grid; grid-template-columns: 1fr 1fr; } }

  .aside { display: none; }
  @media (min-width: 1024px) {
    .aside {
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      padding: 40px var(--pad) 48px; background: var(--bg-2); border-right: 1px solid var(--line);
    }
  }
  .aside::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(10,11,13,0) 0%, rgba(10,11,13,0) 45%, var(--bg) 100%);
  }
  .paths { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s var(--ease); }
  .paths.on { opacity: 1; }
  .paths svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; color: var(--text); }
  .paths path {
    fill: none; stroke: currentColor; opacity: 0.5;
    stroke-dasharray: 0.3 1; stroke-dashoffset: 0;
    animation: drift var(--d, 24s) linear infinite alternate;
  }
  @keyframes drift {
    0%   { stroke-dasharray: 0.3 1;  stroke-dashoffset: 0; }
    50%  { stroke-dasharray: 0.65 1; stroke-dashoffset: -1; }
    100% { stroke-dasharray: 1 1;    stroke-dashoffset: 0; }
  }

  .brand { position: relative; z-index: 2; }
  .brand img { height: 22px; width: auto; }

  .statement { position: relative; z-index: 2; margin: auto 0 0; }
  .statement blockquote {
    margin: 0; max-width: 12ch;
    font-family: var(--head); font-weight: 600; text-transform: uppercase;
    font-size: clamp(56px, 6.4vw, 104px); line-height: 0.95; letter-spacing: 0.005em;
  }
  .statement figcaption {
    display: flex; align-items: center; gap: 10px; margin-top: 24px;
    font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
  }
  .statement figcaption .sep { width: 1px; height: 12px; background: var(--line-2); }

  .main { position: relative; display: flex; flex-direction: column; justify-content: center; min-height: 100svh; padding: 112px var(--pad) 64px; }
  .glow { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .glow i { position: absolute; right: 0; top: 0; height: 1280px; border-radius: 50%; }
  .glow i:nth-child(1) {
    width: 560px; transform: translateY(-352px);
    background: radial-gradient(68.54% 68.72% at 55.02% 31.46%, rgba(240,237,230,0.06) 0, rgba(240,237,230,0.02) 50%, rgba(240,237,230,0.01) 80%, rgba(240,237,230,0) 100%);
  }
  .glow i:nth-child(2) {
    width: 240px; transform: translate(5%, -50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(240,237,230,0.04) 0, rgba(240,237,230,0.01) 80%, rgba(240,237,230,0) 100%);
  }

  .home {
    position: absolute; z-index: 2; top: 28px; left: var(--pad);
    display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 4px;
    font-family: var(--label); font-weight: 500; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-2);
    transition: color .2s;
  }
  .home:hover { color: var(--text); }
  .home svg { width: 14px; height: 14px; transition: transform .3s var(--ease); }
  .home:hover svg { transform: translateX(-3px); }

  .panel { position: relative; z-index: 2; width: 100%; max-width: 400px; margin: 0 auto; }
  .panel-brand img { height: 20px; width: auto; margin-bottom: 40px; }
  @media (min-width: 1024px) { .panel-brand { display: none; } }

  .panel h1 { margin-top: 18px; font-size: clamp(56px, 7vw, 88px); }
  .panel .lede { margin-top: 18px; font-size: 16px; color: var(--text-2); max-width: 34ch; }

  .form { display: grid; gap: 18px; margin-top: 36px; }
  .field { display: grid; gap: 8px; }
  .field span { font-family: var(--label); font-weight: 600; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); }
  .field input {
    width: 100%; height: 52px; padding: 0 16px;
    background: var(--bg-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 0;
    font-family: var(--body); font-size: 16px;
    transition: border-color .2s, background-color .2s;
  }
  .field input:hover { border-color: rgba(240,237,230,0.32); }
  .field input:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; border-color: var(--accent); background: var(--bg-3); }
  .form .btn { width: 100%; margin-top: 6px; }

  .error { display: flex; align-items: baseline; gap: 10px; font-size: 14px; color: var(--text); }
  .error::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transform: translateY(-1px); }
  .error[hidden] { display: none; }

  .note { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }

  /* entrance: staggered rise, off for reduced motion */
  .rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }

  @media (prefers-reduced-motion: reduce) {
    .rise, .paths path, .spinner { animation: none; }
    .paths { transition: none; }
  }
</style>
</head>
<body>

<main class="login">
  <aside class="aside" aria-hidden="true">
    <div class="paths" id="paths"></div>

    <a class="brand rise" href="../../index.html" tabindex="-1">
      <img src="../../brand/wordmark-elevated-light.svg" alt="" width="5424" height="799">
    </a>

    <figure class="statement rise" style="--i:4">
      <blockquote>Create opportunity.</blockquote>
      <figcaption>Elevated Management Group <span class="sep"></span> Tampa, Florida</figcaption>
    </figure>
  </aside>

  <div class="main">
    <div class="glow" aria-hidden="true"><i></i><i></i></div>

    <a class="home rise" href="../../index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14 8H3M7 4 3 8l4 4"/></svg>
      Home
    </a>

    <div class="panel">
      <div class="panel-brand rise">
        <img src="../../brand/wordmark-elevated-light.svg" alt="Elevated" width="5424" height="799">
      </div>

      <p class="kicker rise" style="--i:1">Agent Portal</p>
      <h1 class="rise" style="--i:2">Sign in</h1>
      <p class="lede rise" style="--i:3">Your orders, your team's numbers and your commission, in one place.</p>

      <form id="loginForm" class="form rise" style="--i:4" novalidate>
        <label class="field">
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="loginError" role="alert" hidden></p>
        <button class="btn btn-primary" type="submit">
          <span class="btn-text">Sign in</span>
          <span class="spinner" aria-hidden="true"></span>
          <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
        </button>
      </form>

      <p class="note rise" style="--i:5">Don't have a login yet? Ask your team lead to set one up for you.</p>
    </div>
  </div>
</main>

<script>
(function () {
  var host = document.getElementById('paths');
  var NS = 'http://www.w3.org/2000/svg';

  function jitter(i) {
    var v = Math.sin(i + 1) * 10000;
    return v - Math.floor(v);
  }

  function layer(position) {
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 696 316');
    for (var i = 0; i < 36; i++) {
      var o = i * 5 * position;
      var d = 'M-' + (380 - o) + ' -' + (189 + i * 6) +
        'C-' + (380 - o) + ' -' + (189 + i * 6) + ' -' + (312 - o) + ' ' + (216 - i * 6) + ' ' + (152 - o) + ' ' + (343 - i * 6) +
        'C' + (616 - o) + ' ' + (470 - i * 6) + ' ' + (684 - o) + ' ' + (875 - i * 6) + ' ' + (684 - o) + ' ' + (875 - i * 6);
      var p = document.createElementNS(NS, 'path');
      p.setAttribute('d', d);
      p.setAttribute('pathLength', '1');
      p.setAttribute('stroke-width', (0.5 + i * 0.03).toFixed(2));
      p.setAttribute('stroke-opacity', Math.min(1, 0.1 + i * 0.03).toFixed(2));
      p.style.setProperty('--d', (20 + jitter(i) * 10).toFixed(1) + 's');
      p.style.animationDelay = (-jitter(i + 36) * 20).toFixed(1) + 's';
      svg.appendChild(p);
    }
    return svg;
  }

  if (getComputedStyle(host.parentNode).display !== 'none') {
    host.appendChild(layer(1));
    host.appendChild(layer(-1));
    requestAnimationFrame(function () { host.classList.add('on'); });
  }
})();

(function () {
  var form = document.getElementById('loginForm');
  var errorEl = document.getElementById('loginError');
  var btn = form.querySelector('button[type="submit"]');
  var btnText = btn.querySelector('.btn-text');

  function nextUrl() {
    var params = new URLSearchParams(location.search);
    var next = params.get('next');
    // Only ever redirect within this same portal — never trust an arbitrary
    // external "next" value from the query string.
    return next && next.indexOf('/prototypes/portal/') === 0 ? next : 'overview.html';
  }

  function setBusy(busy) {
    btn.disabled = busy;
    btn.setAttribute('aria-busy', busy ? 'true' : 'false');
    btnText.textContent = busy ? 'Signing in' : 'Sign in';
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorEl.hidden = true;

    var username = form.username.value.trim();
    var password = form.password.value;
    if (!username || !password) {
      errorEl.textContent = 'Enter your username and password.';
      errorEl.hidden = false;
      (username ? form.password : form.username).focus();
      return;
    }

    setBusy(true);

    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (res) {
        return res.json().then(function (data) { return { ok: res.ok, data: data }; });
      })
      .then(function (result) {
        if (!result.ok || !result.data.ok) {
          throw new Error((result.data && result.data.error) || 'Sign in failed');
        }
        location.href = nextUrl();
      })
      .catch(function (err) {
        errorEl.textContent = err.message || 'Sign in failed';
        errorEl.hidden = false;
        setBusy(false);
      });
  });
})();
</script>

</body>
</html>
